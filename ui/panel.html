<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Phlo</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <img class="logo" src="logo.svg" alt="">
    <div class="brand">
      <p class="mark">Phlo</p>
      <h1>localDev</h1>
    </div>
    <p id="run-state" class="pill">Stopped</p>
    <div class="chrome" hidden>
      <button type="button" id="min" aria-label="Minimize">&#8211;</button>
      <button type="button" id="close" aria-label="Close">&#215;</button>
    </div>
  </header>

  <main>
    <div class="actions">
      <button type="button" id="start">Start</button>
      <button type="button" id="stop" class="quiet" hidden>Stop</button>
      <button type="button" id="dashboard" class="ghost">Dashboard</button>
    </div>
    <p id="root-problem" class="banner error" role="alert" hidden></p>
    <p id="port80-note" class="banner warn" role="status" hidden></p>
    <p id="note" class="banner" role="status" hidden></p>
    <form id="dash-port-form" class="port-form" hidden>
      <label for="dash-port">Dashboard port</label>
      <input id="dash-port" type="number" min="1" max="65535" value="7700" required>
      <button type="submit" id="dash-port-save">Change</button>
    </form>
    <p class="hint port-hint" hidden>Changing this port restarts Phlo. Other service ports stay as they are.</p>
    <ul id="services"></ul>
    <p class="hint">While the server is running, Close leaves the dashboard on. When the server is stopped, Close also stops the dashboard.</p>
  </main>
  <script src="panel.js"></script>
</body>
</html>
